<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon-512.png" />
    <link rel="apple-touch-icon" href="/app-icon-512.png" />
    <!-- viewport-fit=cover: draw under the notch (safe areas are handled in CSS).
         interactive-widget=resizes-content: the on-screen keyboard shrinks the layout,
         so sticky footers stay above it. No maximum-scale: inputs are >= 16px, so iOS
         does not zoom on focus and pinch-zoom stays available for accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Onboarding clips and posters are served from Cloudinary: warm up the connection. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- Phase 15: Hebrew / RTL by default; the language last used on this device wins before the
         app loads (no flash of the wrong direction). Keep the key in step with @sistem/shared language.ts. -->
    <script>
      try {
        if (localStorage.getItem('sistem.language') === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (error) {
        /* Storage blocked: Hebrew. */
      }
    </script>
    <title>Sistem</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
