<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phase 15: Hebrew / RTL by default; the language last used on this device wins before the
         app loads (no flash of the wrong direction). Keep the key in step with @sistem/shared language.ts. -->
    <script>
      try {
        if (localStorage.getItem('sistem.language') === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (error) {
        /* Storage blocked: Hebrew. */
      }
    </script>
    <title>Sistem Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
